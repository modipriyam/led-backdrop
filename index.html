<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ice &amp; Sugar Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050814;
  }

  /*
    LED plane: native wall 3584×1536 (7:3).
    Contain so the full backdrop is never cropped.
  */
  #led-plane {
    --led-w: 3584;
    --led-h: 1536;
    --led-ar: calc(var(--led-w) / var(--led-h));
    --glow: rgba(90, 170, 255, 0.38);
    --glow-soft: rgba(60, 130, 220, 0.2);
    --gold: #f0c97a;
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(100vw, calc(100vh * var(--led-ar)));
    height: min(100vh, calc(100vw / var(--led-ar)));
    transform: translate(-50%, -50%);
    background: #050814 url("assets/led-backdrop.jpg") center / 100% 100% no-repeat;
    opacity: 0;
    animation: wall-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
  }

  @keyframes wall-in {
    from { opacity: 0; filter: brightness(0.7) saturate(0.85); }
    to { opacity: 1; filter: none; }
  }

  /* Broadcast depth: soft edge vignette (camera-safe, not a card) */
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background:
      radial-gradient(ellipse 78% 72% at 50% 42%, transparent 55%, rgba(0, 0, 0, 0.38) 100%),
      linear-gradient(to bottom, rgba(0, 0, 0, 0.22), transparent 18%, transparent 78%, rgba(0, 0, 0, 0.35));
  }

  /* Ambient canvas: network / particles / horizon (press-room “alive” feel) */
  #ambient {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.72;
  }

  /* Top spotlight cones — reinforce the set’s practical lights */
  #spots {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 42%;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(ellipse 14% 70% at 18% 0%, rgba(120, 180, 255, 0.18), transparent 70%),
      radial-gradient(ellipse 14% 70% at 39% 0%, rgba(120, 180, 255, 0.15), transparent 70%),
      radial-gradient(ellipse 14% 70% at 61% 0%, rgba(120, 180, 255, 0.15), transparent 70%),
      radial-gradient(ellipse 14% 70% at 82% 0%, rgba(120, 180, 255, 0.18), transparent 70%);
    mix-blend-mode: screen;
    opacity: 0.75;
    animation: spots-drift 22s linear infinite alternate;
  }

  @keyframes spots-drift {
    from { transform: translateX(-1.2%); }
    to { transform: translateX(1.2%); }
  }

  /* Dual light sweeps (broadcast “moving lights”) */
  #light-sweep {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
    opacity: 0.42;
  }

  #light-sweep::before,
  #light-sweep::after {
    content: "";
    position: absolute;
    top: -10%;
    bottom: -10%;
    width: 16%;
    background: linear-gradient(
      105deg,
      transparent 0%,
      rgba(140, 190, 255, 0.05) 35%,
      rgba(220, 235, 255, 0.16) 50%,
      rgba(140, 190, 255, 0.05) 65%,
      transparent 100%
    );
  }

  #light-sweep::before {
    left: -20%;
    animation: sweep 12s linear infinite;
  }

  #light-sweep::after {
    left: -20%;
    width: 10%;
    opacity: 0.55;
    background: linear-gradient(
      75deg,
      transparent,
      rgba(240, 201, 122, 0.1),
      transparent
    );
    animation: sweep 19s linear 4s infinite reverse;
  }

  @keyframes sweep {
    from { transform: translateX(0); }
    to { transform: translateX(780%); }
  }

  /* Side ribbon energy — traces along the curved LED frames */
  #ribbons {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  #ribbons span {
    position: absolute;
    top: 8%;
    bottom: 22%;
    width: 3px;
    border-radius: 2px;
    background: linear-gradient(
      180deg,
      transparent,
      rgba(160, 210, 255, 0.55),
      rgba(240, 201, 122, 0.45),
      rgba(160, 210, 255, 0.35),
      transparent
    );
    box-shadow: 0 0 18px rgba(120, 180, 255, 0.45);
    opacity: 0.55;
    animation: ribbon-run 7.5s ease-in-out infinite;
  }

  #ribbons span:first-child {
    left: 11%;
    transform: rotate(8deg);
  }

  #ribbons span:last-child {
    right: 11%;
    transform: rotate(-8deg);
    animation-delay: 2.4s;
  }

  @keyframes ribbon-run {
    0%, 100% { opacity: 0.25; filter: brightness(0.9); }
    40% { opacity: 0.75; filter: brightness(1.25); }
    70% { opacity: 0.45; filter: brightness(1.05); }
  }

  /* Horizon / city glow shimmer along the floor line */
  #horizon {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 68%;
    height: 14%;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(ellipse 50% 60% at 50% 40%, rgba(180, 220, 255, 0.22), transparent 70%),
      linear-gradient(90deg, transparent, rgba(100, 170, 255, 0.12), transparent);
    filter: blur(8px);
    mix-blend-mode: screen;
    opacity: 0.55;
    animation: horizon-glow 9s ease-in-out infinite alternate;
  }

  @keyframes horizon-glow {
    from { opacity: 0.35; transform: scaleX(0.96); }
    to { opacity: 0.7; transform: scaleX(1.04); }
  }

  /* One-shot screen power-up scan (broadcast open) */
  #boot-scan {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    overflow: hidden;
    border-radius: inherit;
    opacity: 0;
    animation: boot-fade 1.2s ease 0.45s forwards;
  }

  #boot-scan::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 28%;
    background: linear-gradient(
      to bottom,
      transparent,
      rgba(160, 210, 255, 0.22),
      transparent
    );
    animation: boot-scan 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
  }

  @keyframes boot-scan {
    from { top: -30%; }
    to { top: 110%; }
  }

  @keyframes boot-fade {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; }
  }

  #screen-rig {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 42.5%;
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%) scale(0.94);
    opacity: 0;
    z-index: 2;
    animation: screen-in 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
  }

  @keyframes screen-in {
    to {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  }

  #screen-glow {
    position: absolute;
    inset: -10% -8%;
    border-radius: 4%;
    background:
      radial-gradient(ellipse 55% 50% at 50% 45%, var(--glow), transparent 70%),
      radial-gradient(ellipse 80% 70% at 50% 55%, var(--glow-soft), transparent 75%);
    filter: blur(18px);
    opacity: 0.75;
    pointer-events: none;
  }

  /* Brief live-edge flash when slides advance (driven by .flash class) */
  #screen-rig.flash #screen-glow {
    opacity: 1;
    filter: blur(22px) brightness(1.25);
    transition: opacity 0.12s ease, filter 0.12s ease;
  }

  #screen {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    padding: 0.9%;
    border-radius: 0.7%;
    background:
      linear-gradient(165deg, #3a4252 0%, #1a1e28 28%, #0c0e14 70%, #080a0f 100%);
    box-shadow:
      0 0 0 1px rgba(200, 220, 255, 0.16),
      0 0 0 0.28vw #03040a,
      0 0 0 0.5vw #161b26,
      0 1.6vw 3.5vw rgba(0, 0, 0, 0.58),
      0 0 4vw rgba(70, 140, 255, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.14),
      inset 0 -2px 0 rgba(0, 0, 0, 0.7);
    transition: box-shadow 0.2s ease;
  }

  #screen-rig.flash #screen {
    box-shadow:
      0 0 0 1px rgba(180, 220, 255, 0.45),
      0 0 0 0.28vw #03040a,
      0 0 0 0.5vw #161b26,
      0 1.6vw 3.5vw rgba(0, 0, 0, 0.58),
      0 0 5vw rgba(110, 180, 255, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.2),
      inset 0 -2px 0 rgba(0, 0, 0, 0.7);
  }

  #screen::before {
    content: "";
    position: absolute;
    inset: 0.4%;
    border-radius: 0.45%;
    pointer-events: none;
    box-shadow:
      inset 0 0 0 1px rgba(0, 0, 0, 0.8),
      inset 0 0 10px rgba(0, 0, 0, 0.35);
  }

  #screen::after {
    content: "";
    position: absolute;
    right: 1.6%;
    bottom: 0.55%;
    width: 0.45%;
    aspect-ratio: 1;
    min-width: 4px;
    border-radius: 50%;
    background: #6ec8ff;
    box-shadow: 0 0 6px 2px rgba(110, 200, 255, 0.85);
    opacity: 0.9;
    pointer-events: none;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 0.25%;
    background: #121820;
    box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.45);
    transition: background-color 0.35s ease;
  }

  #stage.is-dark {
    background: #7A808A;
  }

  /* Admin: mute wall motion */
  #led-plane.ambient-off #ambient,
  #led-plane.ambient-off #spots,
  #led-plane.ambient-off #light-sweep,
  #led-plane.ambient-off #ribbons,
  #led-plane.ambient-off #horizon,
  #led-plane.ambient-off #floor-spill {
    opacity: 0 !important;
    animation: none !important;
  }

  #blackout {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  body.is-blackout #blackout {
    opacity: 1;
    pointer-events: auto;
  }

  /* Shown when admin asks for fullscreen (browsers block remote FS) */
  #fs-prompt {
    position: fixed;
    inset: 0;
    z-index: 95;
    display: none;
    place-items: center;
    background: rgba(4, 8, 16, 0.72);
    backdrop-filter: blur(6px);
  }

  #fs-prompt.is-on {
    display: grid;
  }

  #fs-prompt button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font-family: Manrope, "Avenir Next", sans-serif;
    font-size: clamp(1.1rem, 2vw, 1.6rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #0b1220;
    padding: 1em 1.6em;
    border-radius: 12px;
    background: linear-gradient(180deg, #f0c97a, #d4a84a);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 12px 40px rgba(0, 0, 0, 0.45);
  }

  #fs-prompt p {
    margin: 0 0 1rem;
    text-align: center;
    color: #e8eef8;
    font-family: Manrope, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }

  #fs-prompt .box {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem;
  }

  #stage iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }

  #glass {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 2;
    background:
      linear-gradient(
        125deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.03) 18%,
        transparent 42%
      ),
      linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.04),
        transparent 28%,
        transparent 78%,
        rgba(0, 0, 0, 0.18)
      ),
      /* faint LED lattice — reads as a real wall panel from the room */
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255, 255, 255, 0.012) 3px,
        rgba(255, 255, 255, 0.012) 4px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 3px,
        rgba(255, 255, 255, 0.012) 3px,
        rgba(255, 255, 255, 0.012) 4px
      );
    mix-blend-mode: screen;
    opacity: 0.5;
  }

  #floor-spill {
    position: absolute;
    left: 50%;
    top: 78%;
    width: 39%;
    height: 12%;
    transform: translate(-50%, 0);
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 0%, rgba(100, 170, 255, 0.28), transparent 70%),
      radial-gradient(ellipse 55% 40% at 50% 10%, rgba(255, 255, 255, 0.08), transparent 65%);
    filter: blur(6px);
    opacity: 0.75;
    z-index: 1;
  }

  #screen-reflect {
    position: absolute;
    left: 50%;
    top: 100%;
    width: 92%;
    height: 34%;
    margin-top: 1.2%;
    transform: translateX(-50%) scaleY(-1);
    transform-origin: top center;
    pointer-events: none;
    border-radius: 0.5%;
    background:
      linear-gradient(
        to bottom,
        rgba(90, 150, 220, 0.22) 0%,
        rgba(40, 80, 140, 0.08) 45%,
        transparent 100%
      );
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent 85%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent 85%);
    filter: blur(1.5px);
    opacity: 0.55;
    z-index: 1;
  }

  /* Live ON-AIR chip — dark-mode toggle */
  #on-air {
    position: absolute;
    top: 3.8%;
    right: 2.8%;
    z-index: 8;
    display: flex;
    align-items: center;
    gap: 0.45em;
    margin: 0;
    padding: 0.38em 0.72em 0.38em 0.55em;
    border-radius: 4px;
    appearance: none;
    -webkit-appearance: none;
    background: linear-gradient(180deg, #ff4a4a 0%, #d01010 100%);
    border: 1.5px solid #ffe0e0;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.55),
      0 0 18px rgba(255, 40, 40, 0.65),
      0 0 36px rgba(255, 60, 60, 0.28);
    font-family: Manrope, "Avenir Next", sans-serif;
    font-size: clamp(0.72rem, 1.05vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    opacity: 0;
    animation: onair-in 0.6s ease 1.2s forwards;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
  }

  #on-air:hover {
    filter: brightness(1.08);
  }

  #on-air i {
    width: 0.7em;
    height: 0.7em;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 18px rgba(255, 255, 255, 0.7);
    animation: onair-blink 1.2s steps(1, end) infinite;
  }

  @keyframes onair-in {
    to { opacity: 1; }
  }

  @keyframes onair-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  @media (prefers-reduced-motion: reduce) {
    #led-plane,
    #screen-rig,
    #on-air,
    #light-sweep::before,
    #light-sweep::after,
    #on-air i,
    #spots,
    #ribbons span,
    #horizon,
    #boot-scan,
    #boot-scan::before {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
    #screen-rig {
      transform: translate(-50%, -50%);
    }
    #boot-scan {
      display: none;
    }
  }

  /*
    Phone / portrait: the 7:3 wall letterboxes into a tiny strip.
    Fill the viewport and grow the stage so the deck is readable.
  */
  @media (max-width: 720px), (max-aspect-ratio: 3/4) {
    #led-plane {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      left: 0;
      top: 0;
      transform: none;
      background-size: cover;
      background-position: center 38%;
    }

    #screen-rig {
      top: 46%;
      width: min(94vw, 100%);
      max-width: 560px;
    }

    #screen {
      padding: 1.4%;
      box-shadow:
        0 0 0 1px rgba(200, 220, 255, 0.16),
        0 0 0 3px #03040a,
        0 0 0 6px #161b26,
        0 12px 28px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(70, 140, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -2px 0 rgba(0, 0, 0, 0.7);
    }

    #on-air {
      top: max(10px, env(safe-area-inset-top, 0px));
      right: max(10px, env(safe-area-inset-right, 0px));
      z-index: 10;
      padding: 0.55em 0.9em 0.55em 0.7em;
      font-size: clamp(0.8rem, 3.6vw, 1rem);
      min-height: 44px;
    }

    /* Cut expensive wall chrome on small screens */
    #ambient,
    #light-sweep,
    #ribbons,
    #spots {
      opacity: 0.35;
    }

    #screen-reflect {
      display: none;
    }
  }

  @media (max-width: 720px) and (orientation: landscape) {
    #screen-rig {
      top: 50%;
      width: min(72vw, 70vh * 16 / 9);
    }
  }
</style>
</head>
<body>
  <div id="led-plane">
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div id="spots" aria-hidden="true"></div>
    <div id="light-sweep" aria-hidden="true"></div>
    <div id="ribbons" aria-hidden="true"><span></span><span></span></div>
    <div id="horizon" aria-hidden="true"></div>
    <div id="floor-spill" aria-hidden="true"></div>
    <button type="button" id="on-air" title="Toggle paper dark mode"><i></i> ON AIR</button>
    <div id="screen-rig">
      <div id="screen-glow" aria-hidden="true"></div>
      <div id="screen">
        <div id="stage">
          <div id="boot-scan" aria-hidden="true"></div>
          <iframe id="deck" src="deck.html?v=trevor3" title="Paper deck" allowfullscreen></iframe>
          <div id="glass" aria-hidden="true"></div>
        </div>
      </div>
      <div id="screen-reflect" aria-hidden="true"></div>
    </div>
    <div id="vignette" aria-hidden="true"></div>
  </div>
  <div id="blackout" aria-hidden="true"></div>
  <div id="fs-prompt" aria-hidden="true">
    <div class="box">
      <p>Admin requested fullscreen</p>
      <button type="button" id="fs-prompt-btn">Enter fullscreen</button>
    </div>
  </div>
  <script src="led-bus.js"></script>
  <script>
    (function () {
      var deck = document.getElementById("deck");
      var rig = document.getElementById("screen-rig");
      var plane = document.getElementById("led-plane");
      var onAir = document.getElementById("on-air");
      var fsPrompt = document.getElementById("fs-prompt");
      var fsPromptBtn = document.getElementById("fs-prompt-btn");
      var flashTimer = null;
      var fsPromptTimer = null;
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var stageFlags = { ambient: !reduced, blackout: false };
      var bus = null;
      try { bus = new BroadcastChannel("ice-sugar-led"); } catch (err) { bus = null; }
      var useRelay = false;
      syncOnAir(true); // dark mode is the default before the iframe reports in

      function enableRelay() {
        if (useRelay || !window.LedBus) return;
        useRelay = true;
        window.LedBus.on("cmd", function (data) {
          if (data && data.from === "admin") handleCmd(data);
        });
        window.LedBus.connect("stage");
      }

      // GitHub Pages has no /cmd relay — only use it when server.mjs is running.
      if (window.LedBus && /^https?:$/i.test(location.protocol)) {
        fetch("/health", { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { if (j && j.ok) enableRelay(); })
          .catch(function () { /* static host — BroadcastChannel only */ });
      }

      function syncOnAir(dark) {
        if (!onAir) return;
        onAir.classList.toggle("is-dark", !!dark);
        onAir.setAttribute("aria-pressed", dark ? "true" : "false");
        var stage = document.getElementById("stage");
        if (stage) stage.classList.toggle("is-dark", !!dark);
      }

      function setAmbient(on) {
        stageFlags.ambient = !!on;
        if (plane) plane.classList.toggle("ambient-off", !stageFlags.ambient);
        publishState();
      }

      function setBlackout(on) {
        stageFlags.blackout = !!on;
        document.body.classList.toggle("is-blackout", stageFlags.blackout);
        publishState();
      }

      function deckWin() {
        try { return deck.contentWindow; } catch (err) { return null; }
      }

      function deckState() {
        var win = deckWin();
        try {
          if (win && typeof win.deckGetState === "function") return win.deckGetState();
        } catch (err) { /* ignore */ }
        return null;
      }

      function publishState() {
        var base = deckState() || { slide: 0, total: 9, dark: true, labels: [], book: [] };
        var state = Object.assign({}, base, {
          ambient: stageFlags.ambient,
          blackout: stageFlags.blackout
        });
        var msg = { type: "state", state: state, from: "stage" };
        try { if (bus) bus.postMessage(msg); } catch (err) { /* ignore */ }
        try {
          if (window.opener && !window.opener.closed) window.opener.postMessage(msg, "*");
        } catch (err) { /* ignore */ }
        try {
          localStorage.setItem("ice-sugar-led-state", JSON.stringify(msg));
        } catch (err) { /* ignore */ }
        try {
          if (useRelay) window.LedBus.publishState(state);
        } catch (err) { /* ignore */ }
        return state;
      }

      var lastCmdKey = "";
      var lastCmdAt = 0;

      function handleCmd(msg) {
        if (!msg || msg.type !== "cmd") return;
        // Drop duplicate deliveries of the same command (relay + BC + postMessage, etc.)
        var key = String(msg.t || "") + ":" + msg.action + ":" + String(msg.value);
        var now = Date.now();
        if (key === lastCmdKey && now - lastCmdAt < 600) return;
        if (msg.action !== "ping") {
          lastCmdKey = key;
          lastCmdAt = now;
        }
        var win = deckWin();
        var action = msg.action;
        try {
          if (action === "next") {
            if (win && win.deckNav) win.deckNav(1);
          } else if (action === "prev") {
            if (win && win.deckNav) win.deckNav(-1);
          } else if (action === "goto") {
            if (win && win.deckGoTo) win.deckGoTo(msg.value | 0);
          } else if (action === "dark") {
            if (win && win.deckSetDark) syncOnAir(win.deckSetDark(true));
          } else if (action === "light") {
            if (win && win.deckSetDark) syncOnAir(win.deckSetDark(false));
          } else if (action === "toggleDark") {
            if (win && win.deckToggleDark) syncOnAir(win.deckToggleDark());
          } else if (action === "ambient") {
            setAmbient(!!msg.value);
            return;
          } else if (action === "blackout") {
            setBlackout(!!msg.value);
            return;
          } else if (action === "fullscreen") {
            requestFullscreenFromAdmin();
          } else if (action === "replayTitle") {
            if (win && win.deckReplayTitle) win.deckReplayTitle();
          } else if (action === "ping") {
            var state = publishState();
            var pong = { type: "pong", state: state, from: "stage" };
            try { if (bus) bus.postMessage(pong); } catch (err) { /* ignore */ }
            try {
              if (window.opener && !window.opener.closed) window.opener.postMessage(pong, "*");
            } catch (err) { /* ignore */ }
            try {
              localStorage.setItem("ice-sugar-led-state", JSON.stringify(pong));
            } catch (err) { /* ignore */ }
            return;
          }
        } catch (err) { /* ignore */ }
        // Deck usually posts its own state; refresh shell flags shortly after
        setTimeout(publishState, 80);
      }

      if (bus) {
        bus.onmessage = function (e) {
          var data = e.data;
          if (!data) return;
          if (data.type === "cmd" && data.from === "admin") handleCmd(data);
          if (data.type === "state" && data.from === "deck") {
            var dark = data.state && data.state.dark;
            syncOnAir(dark);
            publishState();
          }
        };
      }

      window.addEventListener("message", function (e) {
        var data = e.data;
        if (!data) return;
        if (data.type === "cmd" && data.from === "admin") handleCmd(data);
        if (data.source === "deck" && data.type === "state") {
          syncOnAir(data.state && data.state.dark);
          publishState();
        }
      });

      window.addEventListener("storage", function (e) {
        if (e.key !== "ice-sugar-led-cmd" || !e.newValue) return;
        try { handleCmd(JSON.parse(e.newValue)); } catch (err) { /* ignore */ }
      });

      if (onAir) {
        onAir.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          try {
            var win = deckWin();
            if (win && typeof win.deckToggleDark === "function") {
              syncOnAir(win.deckToggleDark());
              publishState();
            }
          } catch (err) { /* ignore */ }
        });
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          var req = document.documentElement.requestFullscreen ||
            document.documentElement.webkitRequestFullscreen;
          if (req) return req.call(document.documentElement);
        } else if (document.exitFullscreen) {
          return document.exitFullscreen();
        }
      }

      function showFsPrompt() {
        if (!fsPrompt) return;
        fsPrompt.classList.add("is-on");
        fsPrompt.setAttribute("aria-hidden", "false");
        clearTimeout(fsPromptTimer);
        fsPromptTimer = setTimeout(hideFsPrompt, 12000);
      }

      function hideFsPrompt() {
        if (!fsPrompt) return;
        fsPrompt.classList.remove("is-on");
        fsPrompt.setAttribute("aria-hidden", "true");
        clearTimeout(fsPromptTimer);
      }

      // Browsers only allow fullscreen from a gesture in THIS window.
      // Admin command → show a one-click prompt on the stage.
      function requestFullscreenFromAdmin() {
        if (document.fullscreenElement) {
          toggleFullscreen();
          hideFsPrompt();
          return;
        }
        var attempt = toggleFullscreen();
        if (attempt && typeof attempt.then === "function") {
          attempt.then(hideFsPrompt).catch(showFsPrompt);
        } else {
          showFsPrompt();
        }
      }

      if (fsPromptBtn) {
        fsPromptBtn.addEventListener("click", function () {
          var attempt = toggleFullscreen();
          if (attempt && typeof attempt.then === "function") {
            attempt.then(hideFsPrompt).catch(function () { /* keep prompt */ });
          } else {
            hideFsPrompt();
          }
        });
      }
      if (fsPrompt) {
        fsPrompt.addEventListener("click", function (e) {
          if (e.target === fsPrompt) hideFsPrompt();
        });
      }

      function flashLive() {
        if (!rig) return;
        rig.classList.add("flash");
        clearTimeout(flashTimer);
        flashTimer = setTimeout(function () { rig.classList.remove("flash"); }, 180);
      }

      function deckNav(delta) {
        try {
          if (deck.contentWindow && typeof deck.contentWindow.deckNav === "function") {
            deck.contentWindow.deckNav(delta);
            return true;
          }
        } catch (err) { /* ignore */ }
        return false;
      }

      function forwardKey(e) {
        var win = deck.contentWindow;
        if (!win) return;
        try {
          win.dispatchEvent(new KeyboardEvent("keydown", {
            key: e.key,
            code: e.code,
            keyCode: e.keyCode,
            which: e.which,
            shiftKey: e.shiftKey,
            bubbles: true,
            cancelable: true
          }));
        } catch (err) { /* ignore */ }
      }

      function isArrow(k) {
        return k === "ArrowRight" || k === "ArrowLeft" || k === "ArrowUp" || k === "ArrowDown";
      }

      function isNavKey(k) {
        return isArrow(k) ||
          k === "PageDown" || k === "PageUp" || k === " " || k === "Enter" || k === "Backspace" ||
          k === "Home" || k === "End";
      }

      window.addEventListener("keydown", function (e) {
        if (e.key === "f" || e.key === "F") {
          e.preventDefault();
          toggleFullscreen();
          return;
        }
        if (e.key === "b" || e.key === "B") {
          e.preventDefault();
          setBlackout(!stageFlags.blackout);
          return;
        }
        // Shell focus: drive the deck directly so ←↑→↓ all work from the LED chrome
        if (document.activeElement !== deck && isNavKey(e.key)) {
          e.preventDefault();
          flashLive();
          if (isArrow(e.key)) {
            deckNav(e.shiftKey ? -1 : 1);
            return;
          }
          if (e.key === "PageDown" || e.key === " " || e.key === "Enter") { deckNav(1); return; }
          if (e.key === "PageUp" || e.key === "Backspace") { deckNav(-1); return; }
          forwardKey(e);
          return;
        }
        if (isNavKey(e.key)) flashLive();
      });

      deck.addEventListener("load", function () {
        try {
          var win = deck.contentWindow;
          syncOnAir(win.deckIsDark && win.deckIsDark());
          publishState();
          win.addEventListener("keydown", function (e) {
            if (e.key === "f" || e.key === "F") {
              e.preventDefault();
              e.stopImmediatePropagation();
              toggleFullscreen();
              return;
            }
            if (isNavKey(e.key)) flashLive();
          }, true);
          win.addEventListener("click", function () { flashLive(); }, true);
        } catch (err) { /* ignore */ }
      });

      if (plane) plane.classList.toggle("ambient-off", !stageFlags.ambient);

      // Broadcast ambient: global network, data packets, city twinkles, drifting dust
      if (reduced) return;
      var canvas = document.getElementById("ambient");
      if (!canvas) return;
      var ctx = canvas.getContext("2d");
      var particles = [];
      var nodes = [];
      var links = [];
      var packets = [];
      var twinkles = [];
      var w = 0, h = 0, t0 = performance.now();

      function resize() {
        var rect = canvas.parentElement.getBoundingClientRect();
        w = Math.max(1, Math.floor(rect.width));
        h = Math.max(1, Math.floor(rect.height));
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function seed() {
        var i, j, a, b, dx, dy, d;
        particles = [];
        nodes = [];
        links = [];
        packets = [];
        twinkles = [];

        for (i = 0; i < Math.floor(w / 55); i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h * 0.7,
            r: 0.5 + Math.random() * 1.8,
            vx: (Math.random() - 0.5) * 0.1,
            vy: -0.015 - Math.random() * 0.07,
            a: 0.12 + Math.random() * 0.4
          });
        }

        // Hub nodes around the map (avoid the center screen band)
        for (i = 0; i < 18; i++) {
          var side = Math.random() < 0.5;
          nodes.push({
            x: side ? w * (0.06 + Math.random() * 0.22) : w * (0.72 + Math.random() * 0.22),
            y: h * (0.18 + Math.random() * 0.45),
            r: 1.5 + Math.random() * 2.2,
            phase: Math.random() * Math.PI * 2
          });
        }
        // A few mid-wall hubs above the screen
        for (i = 0; i < 6; i++) {
          nodes.push({
            x: w * (0.28 + Math.random() * 0.44),
            y: h * (0.12 + Math.random() * 0.14),
            r: 1.2 + Math.random() * 1.6,
            phase: Math.random() * Math.PI * 2
          });
        }

        for (i = 0; i < nodes.length; i++) {
          for (j = i + 1; j < nodes.length; j++) {
            dx = nodes[i].x - nodes[j].x;
            dy = nodes[i].y - nodes[j].y;
            d = Math.sqrt(dx * dx + dy * dy);
            if (d < w * 0.28 && Math.random() < 0.45) {
              links.push({ a: i, b: j, phase: Math.random() * Math.PI * 2, speed: 0.2 + Math.random() * 0.45 });
            }
          }
        }

        links.forEach(function (L, idx) {
          if (idx % 2 === 0) {
            packets.push({
              link: idx,
              u: Math.random(),
              speed: 0.08 + Math.random() * 0.12,
              gold: Math.random() < 0.25
            });
          }
        });

        // City-line twinkles along the horizon
        for (i = 0; i < 40; i++) {
          twinkles.push({
            x: w * (0.12 + Math.random() * 0.76),
            y: h * (0.70 + Math.random() * 0.08),
            phase: Math.random() * Math.PI * 2,
            speed: 0.6 + Math.random() * 1.4,
            r: 0.8 + Math.random() * 1.6
          });
        }
      }

      function frame(now) {
        var t = (now - t0) / 1000;
        var na, nb, alpha, x, y, glow, twA;
        ctx.clearRect(0, 0, w, h);

        // Soft global mesh
        links.forEach(function (L) {
          na = nodes[L.a];
          nb = nodes[L.b];
          alpha = 0.08 + 0.1 * (0.5 + 0.5 * Math.sin(t * L.speed + L.phase));
          ctx.beginPath();
          ctx.moveTo(na.x, na.y);
          ctx.lineTo(nb.x, nb.y);
          ctx.strokeStyle = "rgba(130, 185, 255," + alpha.toFixed(3) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        });

        // Traveling data packets
        packets.forEach(function (p) {
          var L = links[p.link];
          if (!L) return;
          na = nodes[L.a];
          nb = nodes[L.b];
          p.u += p.speed * 0.016;
          if (p.u > 1) p.u -= 1;
          x = na.x + (nb.x - na.x) * p.u;
          y = na.y + (nb.y - na.y) * p.u;
          ctx.beginPath();
          ctx.arc(x, y, p.gold ? 2.6 : 2.1, 0, Math.PI * 2);
          ctx.fillStyle = p.gold
            ? "rgba(240, 201, 122, 0.85)"
            : "rgba(190, 225, 255, 0.8)";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, p.gold ? 7 : 6, 0, Math.PI * 2);
          ctx.fillStyle = p.gold
            ? "rgba(240, 201, 122, 0.12)"
            : "rgba(140, 190, 255, 0.12)";
          ctx.fill();
        });

        nodes.forEach(function (n) {
          glow = 0.35 + 0.25 * Math.sin(t * 0.9 + n.phase);
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r + 3, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(120, 180, 255," + (0.08 + glow * 0.08).toFixed(3) + ")";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(210, 235, 255," + (0.45 + glow * 0.35).toFixed(3) + ")";
          ctx.fill();
        });

        twinkles.forEach(function (tw) {
          twA = 0.15 + 0.55 * Math.abs(Math.sin(t * tw.speed + tw.phase));
          ctx.beginPath();
          ctx.arc(tw.x, tw.y, tw.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 245, 210," + twA.toFixed(3) + ")";
          ctx.fill();
        });

        particles.forEach(function (p) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < -4) { p.y = h * 0.68; p.x = Math.random() * w; }
          if (p.x < -4) p.x = w + 4;
          if (p.x > w + 4) p.x = -4;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(170, 210, 255," + p.a.toFixed(3) + ")";
          ctx.fill();
        });

        requestAnimationFrame(frame);
      }

      resize();
      seed();
      window.addEventListener("resize", function () {
        resize();
        seed();
      });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
